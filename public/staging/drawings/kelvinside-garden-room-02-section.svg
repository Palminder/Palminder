<title id="t">Drawing 02 — Section through garden room and clerestory — Kelvinside Garden Room</title>
<desc id="d">Section from the garden through the new single-storey garden room to the existing two-storey rear wall, showing the stepped roof with a clerestory band against the house, insulated floor and roof build-ups and the rainwater outlet at the low edge.</desc>
