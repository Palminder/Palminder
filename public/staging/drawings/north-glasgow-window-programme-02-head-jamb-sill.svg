<title id="t">Drawing 02 — Head, jamb and sill details — North Glasgow Window &amp; Ventilation Programme</title>
<desc id="d">Typical window head, jamb and sill details through the existing cavity wall: new frame, insulated cavity closer, sealant and backer rod, the airtightness line taped to the inner leaf, a trickle ventilator in the head and a sill with drip; numbered callouts.</desc>
