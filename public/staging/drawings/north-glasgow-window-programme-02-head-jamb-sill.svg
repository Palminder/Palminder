<text x="100" y="1380" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#242722" fill-opacity="0.8">1  Trickle ventilator in the head of the new frame, sized to the room</text>
<text x="100" y="1398" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#242722" fill-opacity="0.8">2  Airtightness line: tape from the inner leaf onto the frame, continuous around the opening</text>
<text x="100" y="1416" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#242722" fill-opacity="0.8">3  New window frame; unit sized from the survey, not from the nominal type</text>
<text x="100" y="1434" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#242722" fill-opacity="0.8">4  Sealant on a backer rod to the outer leaf; not relied on for airtightness</text>
<text x="100" y="1452" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#242722" fill-opacity="0.8">5  Plasterboard reveal on an insulated lining, sealed to the frame</text>
<text x="100" y="1470" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#242722" fill-opacity="0.8">6  Insulated cavity closer replacing the existing uninsulated closer</text>
<text x="100" y="1488" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#242722" fill-opacity="0.8">7  New sill with a drip clear of the outer face; existing sill made good</text>
<text x="100" y="1506" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#242722" fill-opacity="0.8">8  Internal window board bedded on sealant</text>
