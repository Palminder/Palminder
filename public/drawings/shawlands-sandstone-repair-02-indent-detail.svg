<title id="t">Drawing 02 — Stone indent detail — Shawlands Sandstone Repair</title>
<desc id="d">Section through the wall face at a stone indent: decayed face cut back square, new sandstone indent bedded in lime with a non-ferrous dowel, lime pointing finished slightly recessed; with an elevation of the same stone and numbered callouts.</desc>
