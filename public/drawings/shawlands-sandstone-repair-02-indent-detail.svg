<text x="700" y="810" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" fill="#242722" fill-opacity="0.8">Indent cut square to the bed and joint lines,</text>
<text x="700" y="830" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="start" fill="#242722" fill-opacity="0.8">never feathered into sound stone.</text>
<text x="120" y="900" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" fill="#242722" fill-opacity="0.8">1  Original face line; decayed stone cut back square to sound material</text>
<text x="120" y="924" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" fill="#242722" fill-opacity="0.8">2  New sandstone indent, matched by bed, colour and texture, minimum 100 mm deep</text>
<text x="120" y="948" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" fill="#242722" fill-opacity="0.8">3  Lime mortar bedding and joint, compatible with the existing masonry</text>
<text x="120" y="972" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" fill="#242722" fill-opacity="0.8">4  Non-ferrous dowel set in lime grout where the indent needs restraint</text>
<text x="120" y="996" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" fill="#242722" fill-opacity="0.8">5  Lime pointing finished slightly recessed from the arris</text>
<text x="120" y="1020" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start" fill="#242722" fill-opacity="0.8">6  Sound existing stone retained; surface weathering left untouched</text>
