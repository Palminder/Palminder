<title id="t">Drawing 01 — Proposed roof-level plan — Hyndland Roof Rooms</title>
<desc id="d">Proposed roof-level plan above a top-floor tenement flat: new stair arriving between the chimney masses, a bedroom and bathroom within the ridge zone, eaves stores, the 1.5 m headroom line and rooflights on the rear pitch only.</desc>
