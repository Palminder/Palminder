<title id="t">Drawing 01 — Proposed ground-floor plan — Southside Corner Rooms</title>
<desc id="d">Proposed plan of a deep corner unit: step-free corner entrance, café room with counter and perimeter bench, a servicing spine along the party wall with kitchen, store and accessible WC, and an internal glazed screen to the community room at the rear.</desc>
